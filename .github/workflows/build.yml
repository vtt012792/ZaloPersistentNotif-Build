name: Build ZaloPersistentNotif

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git ~/theos
          curl -sLo /tmp/sdks.zip https://github.com/theos/sdks/archive/master.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          mv /tmp/sdks/sdks-master/*.sdk ~/theos/sdks/ || true

      - name: Compile Tweak
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZaloPersistentNotif-Tweak
          path: |
            .theos/obj/debug/*.dylib
            .theos/obj/*.dylib
            packages/*.deb
