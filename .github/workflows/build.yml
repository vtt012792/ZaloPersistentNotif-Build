name: Build ZaloKeepNotif Roothide

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm xz-utils perl git make curl fakeroot dpkg-dev rsync zip

      - name: Install ldid
        run: |
          curl -sL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 -o ldid || true
          if [ -f ldid ]; then
            chmod +x ldid
            sudo mv ldid /usr/local/bin/
          fi

      - name: Setup Roothide Theos and Toolchain
        run: |
          git clone --recursive https://github.com/roothide/theos.git /tmp/theos
          mkdir -p /tmp/theos/toolchain
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/download/test-210562a/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C /tmp/theos/toolchain/
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p /tmp/theos/sdks
          cp -r /tmp/sdks/iPhoneOS16.5.sdk /tmp/theos/sdks/ || cp -r /tmp/sdks/*.sdk /tmp/theos/sdks/
          echo "THEOS=/tmp/theos" >> $GITHUB_ENV

      - name: Build Roothide Deb Package
        run: |
          export THEOS=/tmp/theos
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1
          ls -la packages/

      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZaloKeepNotif-Roothide-Deb
          path: packages/*.deb
